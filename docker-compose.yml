services:
  bitcoind:
    image: ruimarinho/bitcoin-core:23-alpine
    platform: linux/amd64 # no native arm64 build; Docker Desktop emulates amd64 fine for a regtest node
    command: >
      -regtest=1
      -server=1
      -rpcallowip=0.0.0.0/0
      -rpcbind=0.0.0.0
      -rpcuser=tachi
      -rpcpassword=tachi
      -rpcport=18443
      -txindex=1
      -fallbackfee=0.0001
    ports:
      - "18443:18443"
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -regtest -rpcuser=tachi -rpcpassword=tachi getblockchaininfo || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      bitcoind:
        condition: service_healthy
    environment:
      TACHI_NETWORK: regtest
      BITCOIN_RPC_URL: http://bitcoind:18443
      BITCOIN_RPC_USER: tachi
      BITCOIN_RPC_PASSWORD: tachi
      DEMO_MNEMONIC: "test test test test test test test test test test test junk"
    ports:
      - "4110:4110"
